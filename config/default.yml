Vicenzo/Layout/MultilineMethodCallLineBreaks:
  Description: 'Enforces that method calls in a multiline chain must each be on their own line.'
  Enabled: true
  Severity: convention
  IndentationWidth: 2
  VersionAdded: '0.3.0'

Vicenzo/Rails/EnumInclusionOfValidation:
  Description: 'Check if the enum has the inclusion of validation defined.'
  Enabled: true
  Severity: convention
  VersionAdded: '0.1.0'

Vicenzo/RSpec/CompetingSubjects:
  Description: 'Definitions the expectations assert on, two or more in a group declaring no subject, are either hidden contexts or a premise that belongs in a before.'
  Enabled: true
  Severity: convention
  AllowedMethods: []
  Include:
    - '**/spec/**/*_spec.rb'
  Exclude:
    - '**/spec/support/**/*'
    - '**/spec/factories/**/*'
  VersionAdded: '<<next>>'

Vicenzo/RSpec/ConditionalInSpec:
  Description: 'Do not use conditional logic in specs. Extract each branch into an explicit context instead.'
  Enabled: true
  Severity: warning
  Include:
    - '**/spec/**/*_spec.rb'
  Exclude:
    - '**/spec/support/**/*'
    - '**/spec/factories/**/*'
  VersionAdded: '0.4.0'

Vicenzo/RSpec/DerivedPremises:
  Description: 'Do not derive a premise from another premise; declare the complete value where it is needed.'
  Enabled: true
  Severity: warning
  Include:
    - '**/spec/**/*_spec.rb'
  Exclude:
    - '**/spec/support/**/*'
    - '**/spec/factories/**/*'
  VersionAdded: '0.6.0'

Vicenzo/RSpec/DynamicExampleGeneration:
  Description: 'Do not use iteration to dynamically generate example groups or examples.'
  Enabled: true
  Severity: warning
  VersionAdded: '0.4.0'

Vicenzo/RSpec/InconsistentSiblingStructure:
  Description: 'Enforces strict structural consistency (e.g. prevents mixing describe with context or examples with groups).'
  Enabled: true
  Severity: warning
  VersionAdded: '0.2.0'

Vicenzo/RSpec/IterationInsideExample:
  Description: 'Do not call `expect` inside an iteration within an example.'
  Enabled: true
  Severity: warning
  VersionAdded: '0.4.0'

Vicenzo/RSpec/MutatedPremises:
  Description: 'Do not mutate the premises (let, let_it_be, subject) an example starts from.'
  Enabled: true
  Severity: warning
  Include:
    - '**/spec/**/*_spec.rb'
  Exclude:
    - '**/spec/support/**/*'
    - '**/spec/factories/**/*'
  VersionAdded: '0.6.0'

Vicenzo/RSpec/NestedContextImproperStart:
  Description: 'Check if the nested context does not start as a root one.'
  Enabled: true
  Severity: convention
  VersionAdded: '0.1.0'

Vicenzo/RSpec/NestedLetRedefinition:
  Description: 'Check if a let is redefined in a nested example group.'
  Enabled: true
  Severity: warning
  VersionAdded: '0.1.0'

Vicenzo/RSpec/NestedSubjectRedefinition:
  Description: 'Check if a subject is redefined in a nested example group.'
  Enabled: true
  Severity: warning
  VersionAdded: '0.1.0'

Vicenzo/RSpec/LeakyDefinition:
  Description: 'Do not define methods, classes, or modules directly in spec files (unless inside spec/support).'
  Enabled: true
  Severity: warning
  VersionAdded: '0.2.0'
  Include:
    - '**/spec/**/*_spec.rb'
  Exclude:
    - '**/spec/support/**/*'
    - '**/spec/factories/**/*'

Vicenzo/RSpec/LetIsMethodResult:
  Description: 'A let under an example group describing a method must not hold the result of calling that method on the subject.'
  Enabled: true
  Severity: convention
  AllowedMethods: []
  Include:
    - '**/spec/**/*_spec.rb'
  Exclude:
    - '**/spec/support/**/*'
    - '**/spec/factories/**/*'
  VersionAdded: '<<next>>'

Vicenzo/RSpec/SubjectDefinedAsLet:
  Description: 'A let the expectations assert on, in a group declaring no subject, must be declared as the subject.'
  Enabled: true
  Severity: convention
  AllowedMethods: []
  Include:
    - '**/spec/**/*_spec.rb'
  Exclude:
    - '**/spec/support/**/*'
    - '**/spec/factories/**/*'
  VersionAdded: '<<next>>'

Vicenzo/RSpec/SubjectIsMethodResult:
  Description: 'The subject of an example group describing a method must be the object under test, not the method result.'
  Enabled: true
  Severity: convention
  AllowedMethods: []
  Include:
    - '**/spec/**/*_spec.rb'
  Exclude:
    - '**/spec/support/**/*'
    - '**/spec/factories/**/*'
  VersionAdded: '<<next>>'

Vicenzo/Style/JsonParseSymbolizeNames:
  Description: 'Enforces passing `symbolize_names: true` to `JSON.parse` so keys are symbols.'
  Enabled: true
  Severity: convention
  VersionAdded: '0.5.0'

Vicenzo/Style/MultilineMethodCallParentheses:
  Description: 'Enforces parentheses for method calls with arguments that span multiple lines.'
  Enabled: true
  AllowedMethods: []
  VersionAdded: '0.3.0'
